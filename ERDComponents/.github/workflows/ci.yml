name: ERD Components validation
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/validate.py
      - run: python tools/pascalcheck/run.py -v
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - run: |
          mkdir -p build/catalog
          fpc -Mdelphi -Fusrc/UI -FUbuild/catalog -FEbuild/catalog tests/CatalogSmoke.dpr
          build/catalog/CatalogSmoke
