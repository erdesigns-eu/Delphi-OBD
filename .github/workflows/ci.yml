#-------------------------------------------------------------------------------
#  ci.yml — Delphi-OBD continuous integration
#
#  Builds DelphiOBD_RT.dpk and DelphiOBD_DT.dpk and runs the DUnitX test
#  suite on the intended Delphi matrix when enabled. Uploads NUnit artefacts.
#
#  Required runner: a Windows runner with RAD Studio installed. The
#  default config below assumes self-hosted runners labelled
#  'rad-studio-12', 'rad-studio-11', 'rad-studio-10.4', 'rad-studio-10.3'.
#  The Windows-build job is gated off until a runner is wired up; the
#  hygiene job runs on every push so style and JSON catalogues are
#  validated from day one.
#-------------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, v2, 'v2/**', 'claude/v2-phase-1']
  pull_request:
    branches: [main, v2]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VCL-only scope and nonvisual dependency guard
        run: python3 tools/pascalcheck/check_runtime.py

      - name: File header presence on .pas files
        run: |
          set -e
          # Every .pas file must begin with the standard header marker.
          missing=""
          for f in $(find src tests -name '*.pas' 2>/dev/null); do
            if ! head -1 "$f" | grep -q "^//-\{20,\}"; then
              missing="$missing\n$f"
            fi
          done
          if [ -n "$missing" ]; then
            printf "Missing file header:%b\n" "$missing"
            exit 1
          fi

      - name: JSON catalogue lint
        run: |
          set -e
          # All catalogue files must parse as JSON.
          if [ -d catalogs ]; then
            find catalogs -name '*.json' -print0 \
              | xargs -0 -n1 -I{} python3 -c "import json,sys; json.load(open('{}'))"
          fi

  portable-validation:
    name: Pascal analysis and portable FPC smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog audit dependencies
        run: python3 -m pip install -r tools/requirements-validation.txt
      - name: Test catalogue and repository tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check generated EV support matrix and IDE resources
        run: |
          python3 tools/ev_support_matrix.py
          python3 tools/designtime_resources.py
      - name: Validate every catalog against its local schema
        run: python3 tools/validate_catalogs.py --require-coverage
      - name: Test the static analyzers
        run: python3 -m unittest discover -s tools/pascalcheck -p test_checkers.py -v
      - name: Check Pascal sources and hints
        run: python3 tools/pascalcheck/run.py -v
      - name: Install Free Pascal and its RTL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-fcl
      - name: Compile and run portable codec checks
        run: python3 tools/fpc_smoke.py


  fpc-runtime:
    name: Full Linux nonvisual FPC runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bootstrap compiler and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler make binutils gcc libssl-dev openssl
      - name: Build pinned official FPC 3.3.1 and runtime packages
        run: bash tools/setup_fpc_runtime.sh /tmp/erd-fpc-source
      - name: Compile all Linux nonvisual units and run runtime regressions
        run: python3 tools/fpc_runtime.py --source-tree /tmp/erd-fpc-source

  build:
    name: Build & test (Delphi ${{ matrix.delphi }})
    needs: [guard]
    # Phase 0: build matrix is configured but the job is gated off until
    # self-hosted Windows runners with RAD Studio are wired up. See
    # packages/README.md for runner setup notes.
    if: false
    runs-on: [self-hosted, windows, 'rad-studio-${{ matrix.delphi }}']
    strategy:
      fail-fast: false
      matrix:
        delphi: ['12', '11', '10.4', '10.3']
    steps:
      - uses: actions/checkout@v4

      - name: Check Delphi prerequisites
        shell: pwsh
        run: |
          if (-not $env:BDS -or -not (Test-Path "$env:BDS\Bin\CodeGear.Delphi.Targets")) { throw 'RAD Studio BDS environment is missing' }
          if (-not $env:DUNITX_SOURCE -or -not (Test-Path "$env:DUNITX_SOURCE\DUnitX.TestFramework.pas")) { throw 'Set DUNITX_SOURCE to the DUnitX Source directory' }

      - name: Rebuild packages and run DUnitX
        shell: pwsh
        run: ./tools/validate_delphi.ps1 -Platform Win32 -Config Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-results-${{ matrix.delphi }}
          path: tests/nunit-Win32-Release.xml

      # Coverage is not bundled; add a real runner/tool before publishing coverage.
