name: Feature request
description: Suggest a new feature, component, or catalogue addition
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [component reference](https://github.com/erdesigns-eu/Delphi-OBD/blob/main/docs/components.md) and the
        [changelog](https://github.com/erdesigns-eu/Delphi-OBD/blob/main/CHANGELOG.md) first; the feature may already exist.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: User story shape — "as a developer building X I want Y so that Z".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Component name, properties, events, methods if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope impact
      options:
        - "Extends an existing component"
        - "New component"
        - "Catalog / data addition"
        - "Tooling / documentation"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: spec
    attributes:
      label: Spec / standard reference
      description: ISO / SAE / OEM document that backs the request, if any.
